[package]
name = "flatpack"
version = "0.1.0"
description = "NotebookLM preprocessing tool"
authors = ["Flatpack Team"]
edition = "2021"

[lib]
name = "flatpack_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = "2"
ignore = "0.4"
lopdf = "0.33"
pdf-extract = "0.7"
image = "0.25"
tesseract = { version = "0.15", optional = true }
chrono = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
ocr = ["tesseract"]
